<div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>Message Chunker 消息分块器</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content" style="font-size: 14px;">
        
        <label for="mchunker_mode">运行模式：</label>
        <select id="mchunker_mode" class="text_pole">
            <option value="off">关闭</option>
            <option value="messages">消息数量模式</option>
            <option value="tokens">最大 Token 数模式</option>
        </select>
        
        <hr>

        <div id="mchunker_chunk_container">
            <label for="mchunker_chunk_size">分块大小（一次移除的消息数）：</label>
            <input id="mchunker_chunk_size" class="text_pole" type="number" min="1" step="1">
        </div>

        <div id="mchunker_messages_container" style="display: none; margin-top: 10px;">
            <label for="mchunker_min_messages">最少保留消息数：</label>
            <input id="mchunker_min_messages" class="text_pole" type="number" min="1" step="1">
            <div style="margin-top: 5px; opacity: 0.7;">
                <small><i>触发分块前的最大消息数： <span id="mchunker_max_messages_display">0</span></i></small>
            </div>
        </div>

        <div id="mchunker_tokens_container" style="display: none; margin-top: 10px;">
            <label for="mchunker_max_tokens">最大上下文 Token 数：</label>
            <input id="mchunker_max_tokens" class="text_pole" type="number" min="100" step="100">
        </div>

    </div>
</div>
